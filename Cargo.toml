[package]
name = "hydra-umc-swarm-sync"
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
description = "CRDT state reconciliation (last-writer-wins map with a Lamport logical clock) for the HYDRA-UMC swarm."
license = "GPL-3.0-or-later"
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
repository = "https://github.com/JuanenRac/HYDRA-UMC-SWARM-SYNC"

[[bin]]
name = "hydra-umc-swarm-sync"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Real gap found auditing the ecosystem against actual CM5 hardware: the
# real CRDT reconciliation (reconcile()) was only ever reachable as a
# one-shot CLI over a local scenario file. tiny_http is a minimal,
# blocking, no-async-runtime HTTP/1.1 server - the closest Rust
# equivalent to Python's stdlib ThreadingHTTPServer, already used for
# HYDRA-UMC-TWIN's own real internal-only API.
tiny_http = "0.12"
# The typed value of the keys `robot_state/<id>` (src/typed.rs): the same crate and version as the Rust client of the SDK, without its
# network and TLS features - the schema is vendored, nothing is fetched.
jsonschema = { version = "0.50", default-features = false }
