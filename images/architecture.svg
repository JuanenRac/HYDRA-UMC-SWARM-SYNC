<title id="t">HYDRA-UMC-SWARM-SYNC architecture</title>
<desc id="d">HYDRA-UMC-SWARM-SYNC merges the writes of every cell into a last-writer-wins map with a Lamport clock, reports each resolved conflict, keeps its state in a file written atomically, and can pull from and push to peers.</desc>
